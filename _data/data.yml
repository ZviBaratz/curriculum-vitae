career-profile:
    title: Career Profile
    summary: |
        I am a software engineer with a research background. For my PhD I built
        the data platform my lab ran its MRI studies on, and trained
        deep-learning models on thousands of scans. Since 2023 I have been
        building a radiology operations platform at Quantivly. I work mostly in
        Python on Linux, across backend, data and infrastructure, and I am at my
        best taking a problem from the people who have it to a system they rely
        on.

education:
    - degree: PhD in Neuroscience
      university: Tel Aviv University
      time: 2017 - 2023
      details: |
        Thesis: [*Predicting Individual Variability From Anatomical Magnetic
        Resonance Imaging*](https://doi.org/10.5281/zenodo.24492985), supervised
        by Prof. Yaniv Assaf. Modeled sex, age and personality traits from
        structural MRI with convolutional networks (Xception, with transfer
        learning) trained on 4,049 scans from 1,594 participants, and measured
        how preprocessing choices change the results.

    - degree: MSc in Neuroscience
      university: Tel Aviv University
      time: 2013 - 2017
      details: |
        Adi Lautman Interdisciplinary Program for Outstanding Students: a
        four-year direct track to the MSc, on a full scholarship. Completed diverse
        coursework across multiple faculties, from medical anatomy to
        educational theory. Graduated with honors (94.75 final grade) with
        M.Sc. thesis on cortical layer distribution analysis using
        inversion-recovery MRI.


experiences:
    title: Professional Experience
    organizations:
        - name: Quantivly
          time: April 2023 - Present
          avatar: quantivly.png
          roles:
            # One entry for the whole tenure: the organization's dates above cover it, and the second line of the
            # details gives the title history, so the role itself carries no dates.
            - role: Principal Software Engineer
              time:
              details: |
                *Operations software for radiology, spun out of Boston Children's Hospital. Remote from Israel.*<br>
                *Joined as Software Engineer; promoted to Senior in 2024, Lead in 2025 and Principal in 2026.*

                - Led the rebuild of Quantivly Hub, the web application customers use to work with the platform: a Django and GraphQL backend and a React and TypeScript frontend.
                - Built the AI code review used across Quantivly's repositories: on request, Claude reviews a pull request against its linked issue and CI results and comments inline.
                - Own the team's CI/CD pipelines, deployment tooling and development environment.
                - Interview and onboard engineers, oversee others' work, and help plan the roadmap.

        - name: SpotItEarly
          time: Oct 2022 - Apr 2023
          avatar: spotitearly.png
          roles:
            - role: Data Scientist
              time: Oct 2022 - Apr 2023
              details: |
                - Collaborated on data collection and validation processes
                - Developed signal processing algorithms for early cancer detection
                - Created a robust data pipeline for processing and analyzing experimental data
                - Generated informative reports and visualizations to support research findings

        - name: Tel Aviv University
          time: 2015 - 2023
          avatar: tau.png
          roles:
            - role: Graduate Teaching Assistant - Python for Neuroscience
              time: 2019 - 2023
              details: |
                Taught Python programming fundamentals to neuroscience graduate
                students, focusing on data analysis, visualization, and research
                applications. Co-wrote the course's online textbook,
                [*Python for Neuroscientists*](https://sagol-python-for-neuroscientists.github.io/textbook-public/intro.html).

            - role: Graduate Teaching Assistant - Machine Learning for Neuroscience
              time: 2019 - 2023
              details: |
                Instructed graduate students in neuroscience-oriented machine learning
                concepts, tools, and practical applications for brain data analysis.

            - role: Research Assistant
              time: 2018
              details: |
                Enhanced Flow Image Correlation Spectroscopy (FLICS) analysis
                implementation and developed an intuitive application for running
                analyses and visualizing results.

            - role: Neuroanatomy Laboratory Teaching Assistant
              time: 2015 - 2020
              details: |
                Guided undergraduate and graduate students through hands-on
                neuroanatomy laboratory sessions and practical learning experiences.


projects:
    title: Open Source Projects
    intro: >
      Open-source software from my research years and since; my work at
      Quantivly is in private repositories.
    assignments:
      - title: dicom_parser
        link: "https://github.com/open-dicom/dicom_parser"
        tagline: "A Python library I wrote during the PhD for reading DICOM headers, the metadata of medical images, built on pydicom (2020–2023)."

      - title: The Labbing Project
        link: "https://github.com/TheLabbingProject"
        tagline: "The Django applications I built during the PhD to manage a lab's MRI research data and run analysis pipelines on it (2018–2023). Now archived."

      - title: csa_header
        link: "https://github.com/open-dicom/csa_header"
        tagline: "A parser for the CSA headers that Siemens MRI scanners store in DICOM files."

      - title: awesome-dicom
        link: "https://github.com/open-dicom/awesome-dicom"
        tagline: "A curated list of DICOM libraries, tools and learning resources, which I maintain."

      - title: hara-hachi-bu
        link: "https://github.com/ZviBaratz/hara-hachi-bu"
        tagline: "A GNOME Shell extension that puts power profiles and battery charging thresholds in Quick Settings."

